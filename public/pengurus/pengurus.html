<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pengurus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        /* Navbar */
        .navbar {
            background-color: #333;
            overflow: hidden;
        }
        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        /* Page Sections */
        .section {
            padding: 20px;
            display: none;
        }
        .active {
            display: block;
        }
        /* Form Pendaftaran */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .form-group img {
            display: block;
            margin-top: 10px;
            max-width: 200px;
            max-height: 200px;
        }
        /* Pengurus Cards */
        .card {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px;
            display: inline-block;
            cursor: pointer;
        }
        .card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
            padding-top: 60px;
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        /* Print Button */
        .print-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="../index.html">Beranda</a>
        <a href="#" onclick="showSection('staff')">Staff</a>
    </div>

    <!-- Halaman Pendaftaran -->
    <div id="home" class="section active">
        <h1>Selamat Datang</h1>
        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Nama:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="role">Peran:</label>
                <input type="text" id="role" name="role" required>
            </div>
            <div class="form-group">
                <label for="photo">URL Foto:</label>
                <input type="url" id="photo" name="photo" required oninput="validateAndPreviewImage()">
                <img id="photoPreview" src="#" alt="Preview Foto" style="display:none;">
            </div>
            <button type="button" onclick="register()">Daftar</button>
        </form>
    </div>


    <!-- Halaman Staff -->
    <div id="staff" class="section">
        <h1>Daftar Pengurus</h1>
        <h2>Staff</h2>
        <div class="card" onclick="showModal('John Doe', 'staff.jpg')">
            <img src="staff.jpg" alt="Staff Image">
            <p>John Doe</p>
        </div>
        <h2>AMF</h2>
        <div class="card" onclick="showModal('Jane Smith', 'amf.jpg')">
            <img src="amf.jpg" alt="AMF Image">
            <p>Jane Smith</p>
        </div>
    </div>

    <!-- Modal Popup -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <p id="modal-text"></p>
            <button class="print-button" onclick="printCard()">Cetak</button>
        </div>
    </div>

    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode"></script> <!-- QR Code Library -->

    <script>
        // Fungsi untuk navigasi antar halaman
        function showSection(sectionId) {
            var sections = document.getElementsByClassName('section');
            for (var i = 0; i < sections.length; i++) {
                sections[i].classList.remove('active');
            }
            document.getElementById(sectionId).classList.add('active');
        }

        // Validasi URL gambar dan preview gambar
        function validateAndPreviewImage() {
            const photoUrl = document.getElementById('photo').value;
            const previewImage = document.getElementById('photoPreview');
            const img = new Image();
            img.onload = function() {
                previewImage.src = photoUrl;
                previewImage.style.display = 'block';
            }
            img.onerror = function() {
                previewImage.style.display = 'none';
            }
            img.src = photoUrl;
        }

        // Fungsi pendaftaran dan masuk tanpa login
        function register() {
            const name = document.getElementById('name').value;
            const role = document.getElementById('role').value;
            const photo = document.getElementById('photo').value;

            // Tambahkan pengurus ke halaman staff
            const staffSection = document.getElementById('staff');
            const newCard = document.createElement('div');
            newCard.className = 'card';
            newCard.onclick = function() { showModal(name, photo); };
            newCard.innerHTML = `<img src="${photo}" alt="${name}"><p>${name}</p>`;
            staffSection.appendChild(newCard);

            // Pindah ke halaman staff
            showSection('staff');
        }

        // Fungsi untuk menampilkan modal popup
        function showModal(name, imageSrc) {
            document.getElementById('modal-text').innerHTML = 'Apakah Anda ingin mencetak kartu identitas untuk ' + name + '?';
            document.getElementById('myModal').style.display = 'block';
        }

        // Fungsi untuk menutup modal popup
        function closeModal() {
            document.getElementById('myModal').style.display = 'none';
        }

        // Fungsi untuk mencetak kartu identitas
        async function printCard() {
            const name = document.getElementById('name').value;
            const role = document.getElementById('role').value;
            const photo = document.getElementById('photo').value;

            // Generate nomor ID unik
            const idNumber = 'ID-' + new Date().getTime();

            // URL logo organisasi
            const logoURL = 'https://via.placeholder.com/100x50.png?text=Logo+Organisasi';

            // Buat PDF dengan jsPDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Tambahkan logo organisasi
            doc.addImage(logoURL, 'PNG', 20, 10, 50, 25);

            // Tambahkan konten ke PDF
            doc.setFontSize(20);
            doc.text(name, 20, 50);
            doc.setFontSize(14);
            doc.text(role, 20, 60);
            doc.text('Nomor ID: ' + idNumber, 20, 70);
            doc.addImage(photo, 'JPEG', 20, 80, 50, 50);

            // Generate QR Code dan tambahkan ke PDF
            const qrImageData = await generateQRCode(idNumber);
            doc.addImage(qrImageData, 'PNG', 100, 80, 50, 50);

            // Tambahkan footer atau tanda tangan
            doc.setFontSize(12);
            doc.text('Tanda tangan:', 20, 140);
            doc.line(20, 145, 70, 145); // garis tanda tangan

            // Unduh PDF setelah QR code ter-generate
            doc.save(`${name}_ID_Card.pdf`);

            closeModal();
        }

        // Fungsi untuk generate QR Code
        function generateQRCode(text) {
            return new Promise((resolve, reject) => {
                const qrCanvas = document.createElement('canvas');
                QRCode.toCanvas(qrCanvas, text, function (error) {
                    if (error) {
                        reject(error);
                    } else {
                        resolve(qrCanvas.toDataURL('image/png'));
                    }
                });
            });
        }
    </script>
</body>
</html>
